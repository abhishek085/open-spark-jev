<line x1="367.5" y1="146" x2="367.5" y2="324" stroke="#e4e3df"/><text x="367.5" y="340" font-size="12" fill="#8a8985" text-anchor="middle">0.25</text>
<line x1="485.0" y1="146" x2="485.0" y2="324" stroke="#e4e3df"/><text x="485.0" y="340" font-size="12" fill="#8a8985" text-anchor="middle">0.50</text>
<line x1="602.5" y1="146" x2="602.5" y2="324" stroke="#e4e3df"/><text x="602.5" y="340" font-size="12" fill="#8a8985" text-anchor="middle">0.75</text>
<line x1="720.0" y1="146" x2="720.0" y2="324" stroke="#e4e3df"/><text x="720.0" y="340" font-size="12" fill="#8a8985" text-anchor="middle">1.00</text>
<text x="236" y="173" font-size="14" fill="#0b0b0b" text-anchor="end" >Jev (hosted)</text>
