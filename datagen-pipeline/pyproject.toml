[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "os-datagen"
version = "0.1.0"
description = "Local-first general decision-data factory for open-spark-Jev: verifiable Choice/Score/Boolean datasets with provenance."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.6", "pyyaml>=6", "jinja2>=3.1", "httpx>=0.27", "typer>=0.12"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
os-datagen = "os_datagen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["real_llm: needs a running local OpenAI-compatible endpoint"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
