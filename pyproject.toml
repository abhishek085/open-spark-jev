[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-spark-jev"
version = "0.1.0"
description = "open-spark-Jev: an open, local System One decision model (Choice / Score / Noul) built on Qwen3 and optimized for NVIDIA DGX Spark + TensorRT-LLM."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Abhishek Rai" }]
keywords = ["decision-model", "calibration", "qwen3", "tensorrt-llm", "dgx-spark", "rlcd", "system-one"]
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "pyyaml>=6",
  "httpx>=0.27",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# HF training / in-process inference. torch is intentionally NOT pinned here:
# on DGX Spark install the CUDA-13 wheel that matches your driver first
# (see docs/DGX_SPARK.md), then `pip install -e .[train]`.
train = [
  "transformers>=4.51",
  "datasets>=2.19",
  "accelerate>=0.30",
  "peft>=0.11",
  "trl>=0.24",
  "safetensors>=0.4",
  "scikit-learn>=1.4",
]
serve = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
]
dev = [
  "pytest>=8",
  "ruff>=0.4",
]

[project.scripts]
osj = "open_spark_jev.cli:main"

[tool.setuptools.packages.find]
include = ["open_spark_jev*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device and model weights"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B008", "B905"]
