# spark-s1 v7.5 SFT: v7.4's diversified data, plus KL-to-v6 replay (see open_spark_jev/experimental/replay_kl.py).
#
# Borrowed from decider-4b's v2 -> v2.1 fix: train a sample of the prior checkpoint's own training
# rows toward that checkpoint's own predicted distribution (KL loss, sft.py already supports this via
# target.dist) instead of hard labels, so the model has an explicit reason not to drift on data it
# already handled well while it learns prog_v1's new families. v7.4 attacks the cause of the JevBench-
# hard regression (prog_v1's templated boilerplate); this attacks the symptom the same way decider-4b
# did. data/synthetic/replay_v6.jsonl is generated by:
#   python -m open_spark_jev.experimental.replay_kl --model checkpoints/v6-4b \
#     --source data/synthetic/v5_train.jsonl --n 2500 --out data/synthetic/replay_v6.jsonl
model: models/Qwen3.5-4B
output_dir: checkpoints/v7.5-4b
data:
  - data/synthetic/v5_train.jsonl
  - data/synthetic/prog_v1/train.jsonl
  - data/synthetic/replay_v6.jsonl
seed: 0
val_frac: 0.05
max_len: 2048
epochs: 1
batch_size: 8
grad_accum: 4
lr: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
lambda_brier: 0.5
gradient_checkpointing: true
aux_head: false
lora: {r: 16, alpha: 32, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj]}
log_every: 10
