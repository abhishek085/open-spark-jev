<text x="48" y="908" font-size="12" fill="#52514e">spark-s1 v3 is a public Qwen3 backbone fine-tuned on 967 code-labelled decision rows; Kev is trained on 10-13 public datasets plus programmatic policy pairs; Jev&#x27;s training data is unknown.</text>
<text x="48" y="927" font-size="12" fill="#52514e">This is Kev&#x27;s suite (their rendering and option order), so it favours Kev. Jev was scored only on the development partition, where spark-s1 was also read once for this chart.</text>
<text x="48" y="946" font-size="12" fill="#52514e">Kev-0.6B deadline accuracy is not published. Numbers: docs/img/kev-comparison.json. Sources: github.com/jaredpalmer/kev (2026-09-20), docs/BENCHMARKS.md B32.</text>
