# Phase 2, mechanism 1: academic RLCD (Yang et al. 2023) -- contrastive-principle pairs ->
# Bradley-Terry reward model -> exact menu policy gradient with the RM's per-action score
# folded in. See open_spark_jev/train/rlcd.py module docstring for why this is "RLCD" in the
# strict, citable sense, as distinct from TypeSafe's same-acronym, undisclosed mechanism.
# Run: scripts/train_rlcd_contrastive.sh
seed: 0
data:
  - data/synthetic/sim_train.jsonl
  - data/synthetic/teacher_train.jsonl
teacher_base_url: http://localhost:8014/v1     # gemma26b (configs/teachers.yaml) -- switched from qwen27b
teacher_model: nvidia/Gemma-4-26B-A4B-NVFP4     # 2026-09-19: teacher_benchmark.py showed gemma26b is the
                                                 # best-calibrated of the three reachable teachers (soft
                                                 # Brier vs posterior beats qwen27b and nemotron120b despite
                                                 # being the smallest/fastest -- see docs/BENCHMARKS.md
                                                 # teacher-comparison section), so it replaces qwen27b here
                                                 # to test whether a better teacher moves accuracy/calibration
                                                 # or the injection-robustness-vs-accuracy tradeoff (see
                                                 # docs/RESEARCH.md R1 Claim B).
max_pairs: 500       # unchanged -- still plenty of signal for a Bradley-Terry RM
concurrency: 8        # this repo's own container (osj-teacher-gemma), not shared, no crash
                      # history -- can run higher than qwen27b's shared-service limit of 3.
pairs_path: data/synthetic/rlcd_pairs.jsonl

# reward model (itself a menu scorer answering a Noul)
rm_init: checkpoints/sft-qwen3-1.7b
rm_output_dir: checkpoints/rm-qwen3-1.7b
rm_lr: 1.0e-5
rm_epochs: 1
rm_batch_size: 4

# policy
policy_init: checkpoints/sft-qwen3-1.7b
rm_path: checkpoints/rm-qwen3-1.7b
output_dir: checkpoints/rlcd-contrastive-qwen3-1.7b
epochs: 1
batch_size: 8
grad_accum: 2
lr: 5.0e-6
kl_beta: 0.05
max_len: 2048
gradient_checkpointing: true
reward_weights:
  brier: 1.0          # proper scoring rule vs posterior / label (distribution-level)
  abstain: 0.3        # abstain when posterior is flat, not otherwise
  conservative: 0.3   # asymmetric penalty around the domain's safe action
  injection: 0.5      # consistency between injected and clean twins (needs clean twins in data)
  rm: 0.5             # learned reward model, per action -- the part that makes this mechanism 1
  correctness: 0.0    # explicitly off -- keeps mechanism 1's per-action reward driven only by
                       # the RM (which was itself trained toward calibrated/safe/uninfluenced
                       # decisions), not mixed with a raw hard-label-matching term. See
                       # train/rlcd.py train_policy() and configs/train/rlcd_direct.yaml for why.
log_every: 10
