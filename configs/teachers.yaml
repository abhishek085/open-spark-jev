# Registry of local teacher models used ONLY for offline data generation (scenario authoring +
# distribution grading). None of these are shipped or served as the product model — the product
# is the Qwen3-1.7B backbone trained in configs/model/. Three teachers, three labs, three
# architectures, chosen to test whether the choice of teacher actually matters for downstream
# student quality (see docs/COOKBOOK.md "Multi-teacher data generation").
#
# All weights live in the SHARED HF cache (~/.cache/huggingface), not in this repo's models/ dir,
# because they are tooling, not the deliverable. Only one fits in memory at a time alongside
# whatever else is running on this box — see `mem_preflight_gb` and scripts/teachers/*.sh.
teachers:
  qwen27b:
    hf_id: nvidia/Qwen3.6-27B-NVFP4
    family: Qwen (Alibaba), dense 27B, NVFP4
    base_url: http://localhost:8010/v1
    already_running: true          # served persistently by the sibling nokast-foundry project
    max_concurrency: 3             # shared service; also: this vLLM build has a latent
                                    # flashinfer/cuDNN fp8-GEMM-autotune crash under concurrent
                                    # load (observed 2026-09-18, EngineDeadError, container
                                    # exited) -- keep concurrency low, see docs/DATA.md
    notes: >
      Reuses nokast-foundry's long-running nokast-teacher-vllm container (read-only client
      use; never stop it from this repo -- if it crashes, restart it with
      `bash ~/llm-workspace/nokast-foundry/ops/teacher_server.sh start`, not a container this
      repo owns).

  nemotron120b:
    hf_id: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    family: NVIDIA Nemotron 3, hybrid Mamba-2/MoE, 120B total / 12B active, NVFP4-native
    base_url: http://localhost:8012/v1
    port: 8012
    container: osj-teacher-nemotron
    gpu_memory_utilization: 0.85   # total budget incl. weights, not an add-on -- see serve_nemotron.sh
    mem_preflight_gb: 105          # required free/available memory before launch
    launch: scripts/teachers/serve_nemotron.sh
    notes: >
      Already cached on this box (82 GB, ~17 NVFP4 shards). MoE architecture gives strong
      quality per active-compute-dollar; good test of whether a bigger, differently-trained
      teacher improves label quality over the 27B dense Qwen. Measured: overall soft Brier
      0.315 vs qwen27b's 0.142 -- notably worse despite the size, see docs/BENCHMARKS.md.

  gemma26b:
    hf_id: nvidia/Gemma-4-26B-A4B-NVFP4
    family: Google DeepMind Gemma 4, MoE, 26B total / 4B active, NVFP4
    base_url: http://localhost:8014/v1
    port: 8014
    container: osj-teacher-gemma
    gpu_memory_utilization: 0.40   # total budget incl. weights -- checkpoint is only 18GB, see serve_gemma.sh
    mem_preflight_gb: 55
    launch: scripts/teachers/serve_gemma.sh
    notes: >
      Already cached on this box (18 GB NVFP4). Third lab (Google, after Alibaba/Qwen and
      NVIDIA/Nemotron) and a much smaller/faster MoE than Nemotron -- tests whether the
      "bigger MoE scored worse" finding from Nemotron generalizes to a small MoE too, or was
      specific to that one model. `Gemma4ForConditionalGeneration` is a multimodal-capable
      architecture but served text-only here.

  gptoss120b:
    hf_id: openai/gpt-oss-120b
    family: OpenAI gpt-oss, MoE, 120B total / ~5.1B active, native MXFP4
    base_url: http://localhost:8013/v1
    port: 8013
    container: osj-teacher-gptoss
    gpu_memory_utilization: 0.75   # total budget incl. weights, not an add-on -- see serve_gptoss.sh
    mem_preflight_gb: 92
    launch: scripts/teachers/serve_gptoss.sh
    hf_cache: ~/.cache/huggingface-osj   # ~/.cache/huggingface/hub is root-owned on this box;
                                          # gpt-oss-120b downloads here instead (scripts/download_gptoss.sh)
    status: blocked   # NOT currently usable on this box, see docs/DGX_SPARK.md "openai/gpt-oss-120b
                       # is blocked". /v1/chat/completions fails to initialize (openai_harmony's Rust
                       # vocab loader, confirmed open upstream bug on ARM64/DGX Spark) and
                       # /v1/completions can't substitute for it: hand-typed harmony special tokens
                       # (<|start|>, <|channel|>, etc.) are not recognized as real control tokens by
                       # the plain-text tokenizer that endpoint uses, so the model sees garbled text
                       # instead of structured turns and produces degenerate output. Reproducing
                       # harmony's tokenization correctly would need its own token-ID mapping, i.e.
                       # reimplementing the broken library -- out of scope here. Left in the registry
                       # (not deleted) as an honest record of a real, currently-unresolved blocker.
    notes: >
      Apache-2.0. Third lab/architecture for diversity -- blocked on this box for now, see `status`.

# Nemotron and gpt-oss each need a large fraction of the box's 121GB unified memory (weights
# alone: 82GB and 61GB respectively; gpu_memory_utilization is the TOTAL budget including
# those weights, not a reservation on top of them -- see serve_nemotron.sh's comment for the
# incident that established this). They do NOT fit alongside each other, and may not fit
# alongside the sibling project's nokast-teacher-vllm / nokast-student-vllm containers
# (~20-25GB combined). gemma26b is much lighter (18GB checkpoint) and coexists easily.
# scripts/teachers/*.sh check available memory before launching and abort with instructions
# rather than risk an OOM; they never stop another project's containers automatically (see
# docs/DATA.md "Memory budget for teachers").
