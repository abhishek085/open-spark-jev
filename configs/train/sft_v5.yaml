# spark-s1 v5 SFT: Jev-style only (harness, guardrail, routing, moderation, records and control decisions); same lower-LR, one-epoch recipe as v4.

model: models/Qwen3-1.7B
output_dir: checkpoints/v5-1.7b
data:
  - data/synthetic/v5_train.jsonl
seed: 0
val_frac: 0.05
max_len: 2048
epochs: 1
batch_size: 8
grad_accum: 4
lr: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
lambda_brier: 0.5
gradient_checkpointing: true
aux_head: false
lora: {r: 16, alpha: 32}
log_every: 10
