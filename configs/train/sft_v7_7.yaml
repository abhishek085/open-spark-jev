# spark-s1 v7.7 (A4): same backbone, data and LoRA schedule as v7.2, but the readout is an
# evidential (Dirichlet) linear head instead of the restricted LM-head, trained with the
# evidential-Brier loss (open_spark_jev/experimental/variants.py:evidential_loss) instead of
# plain CE+Brier. Ported from the original A0-A3 1.7B/old-data harness (variants.py) onto the
# current v7.x 4B pipeline so it's directly comparable to v7.2/v7.3/v7.6's numbers.
model: models/Qwen3.5-4B
output_dir: checkpoints/v7.7-4b
data:
  - data/synthetic/v5_train.jsonl
  - data/synthetic/prog_v1/train.jsonl
seed: 0
val_frac: 0.05
max_len: 2048
epochs: 1
batch_size: 8
grad_accum: 4
lr: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
aux_head: true
gradient_checkpointing: true
lora: {r: 16, alpha: 32, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj]}
log_every: 10
