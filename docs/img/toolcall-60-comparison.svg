<text x="850" y="128" font-size="16" font-weight="600" fill="#0b0b0b">Median latency, ms (lower is better)</text>
<line x1="850.0" y1="146" x2="850.0" y2="324" stroke="#e4e3df"/><text x="850.0" y="340" font-size="12" fill="#8a8985" text-anchor="middle">0</text>
<line x1="920.0" y1="146" x2="920.0" y2="324" stroke="#e4e3df"/><text x="920.0" y="340" font-size="12" fill="#8a8985" text-anchor="middle">150</text>
<line x1="990.0" y1="146" x2="990.0" y2="324" stroke="#e4e3df"/><text x="990.0" y="340" font-size="12" fill="#8a8985" text-anchor="middle">300</text>
<line x1="1060.0" y1="146" x2="1060.0" y2="324" stroke="#e4e3df"/><text x="1060.0" y="340" font-size="12" fill="#8a8985" text-anchor="middle">450</text>
