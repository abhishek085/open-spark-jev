# RLDM-9: offline advantage-weighted regression on top of v7.6-4b, using
# data/synthetic/awr_v1_calibration.jsonl (built by experimental/awr_data.py from
# v7.2-v7.6's already-logged calibration-split predictions). No live rollout.
model: checkpoints/v7.6-4b
output_dir: checkpoints/v7.9-4b
data: data/synthetic/awr_v1_calibration.jsonl
seed: 0
val_frac: 0.05
max_len: 2048
epochs: 2
batch_size: 8
grad_accum: 4
lr: 2.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
gradient_checkpointing: true
lora: {r: 16, alpha: 32, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj]}
log_every: 10
