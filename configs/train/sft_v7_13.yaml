# spark-s1 v7.13 SFT from base: the v7.11 mix + prog_long_v1 (4.5k long-document rows: calendar/timezone arithmetic, multi-step procedure manuals 2-3k tokens, long policy), max_len 4096 so long rows are not truncated.
model: models/Qwen3.5-4B
output_dir: checkpoints/v7.13-4b
data:
  - data/mixes/v7_13_train.jsonl
seed: 0
val_frac: 0.05
max_len: 4096
epochs: 1
batch_size: 4
grad_accum: 8
lr: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
lambda_brier: 1.0
gradient_checkpointing: true
aux_head: false
lora: {r: 16, alpha: 32, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj]}
log_every: 10
