<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1200" height="780" fill="#fcfcfb"/>
<text x="48" y="54" font-size="26" font-weight="600" fill="#0b0b0b">spark-s1 vs Jev on the 60-case tool-call diagnostic set</text>
<text x="48" y="82" font-size="15" fill="#52514e">Same 60 hand-labelled agent tool calls, four risk postures. Jev is its recorded hosted run; spark-s1 ran locally on one DGX Spark (batch 1).</text>
