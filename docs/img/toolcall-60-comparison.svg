<circle cx="927.6" cy="469.5" r="6" fill="#a9a8a2" stroke="#fcfcfb" stroke-width="1.5"><title>Qwen3-4B, untrained clear: 0.794</title></circle>
<text x="326" y="507" font-size="14" fill="#0b0b0b" text-anchor="end">Ambiguous (14)</text><line x1="340" y1="502" x2="1080" y2="502" stroke="#e4e3df" stroke-dasharray="2 4"/>
<polygon points="868.6,481.5 875.6,488.5 868.6,495.5 861.6,488.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="1.5"><title>Jev (hosted) ambiguous: 0.714</title></polygon>
