sft-qwen3-1.7b:
  date: '2026-09-18'
  checkpoint: checkpoints/sft-qwen3-1.7b
  parent: null
  eval: runs/eval_sft.json
  mechanism: 'Phase 1: supervised fine-tune of Qwen3-1.7B on 16,200 simulator-generated menu-scoring examples
    across 6 domains. Loss = cross-entropy against soft targets (known posteriors) where available, one-hot
    otherwise, plus a Brier-score regularizer (lambda=0.5). Two epochs, per-question-type temperature
    fitted on a held-out split at the end of training. No RL.'
  jev_comparison: 'TypeSafe has not disclosed whether Jev has a supervised pretraining stage at all before
    its RL phase. This is our default assumption (standard practice: bootstrap the menu format and basic
    task competence before any RL refinement), not a claim that Jev does the same. This is the bootstrap
    every other checkpoint in this registry is trained from.'
  notes: 'Baseline for every later comparison. Overall accuracy 0.808, ECE 0.020 on held-out test data
    vs the untrained backbone''s 0.34/0.65. injection_flip_rate 0.038 (untrained: 0.67), despite never
    being explicitly trained against injected states in this stage -- soft-target training against the
    true label regardless of injected text appears to confer injection robustness as a side effect worth
    investigating further. NOTE: moderation/incident/game slices in this eval are contaminated by train/test
    state leakage in the corpora used (see docs/BENCHMARKS.md); routing/risk/security are the trustworthy
    columns.'
rlcd-direct-qwen3-1.7b:
  date: '2026-09-18'
  checkpoint: checkpoints/rlcd-direct-qwen3-1.7b
  parent: sft-qwen3-1.7b
  eval: runs/eval_rlcd_direct.json
  mechanism: 'Phase 2, mechanism 2 (direct calibration objective): exact menu policy gradient (full action
    distribution differentiated directly, no sampling) on top of the SFT checkpoint. Reward = Brier score
    against ground-truth/teacher soft-label distributions plus abstention/conservative-action/injection-consistency
    shaping terms. No contrastive pairs, no reward model, no teacher calls at all during this stage --
    reward is calibration, measured directly.'
  jev_comparison: TypeSafe's only disclosed statement about their RLCD reward is that it rewards 'a confidence
    score that actually matches how often it's right.' This checkpoint is our most literal implementation
    of exactly that sentence, with everything else (pairs, RM, teacher-in-the-loop) deliberately stripped
    out so the comparison to mechanism 1 (rlcd-contrastive) isolates what the contrastive/RM machinery
    actually buys, if anything.
  notes: 'Corrected version, after a real reward-composition bug (an unweighted hard-label correctness
    term fighting the Brier term) was found and fixed in the first attempt -- see runs/archive_buggy_rlcd_direct_20260918/
    for the buggy checkpoint and its numbers, preserved rather than deleted. Corrected result: accuracy
    0.808->0.813, Brier 0.282->0.276, injection_flip_rate 0.038->0.027, ECE flat at 0.020. Modest, defensible
    improvement on Brier and injection robustness; not a dramatic ECE win over SFT + temperature scaling
    alone.'
rlcd-direct-qwen3-1.7b-BUGGY-archived:
  date: '2026-09-18'
  checkpoint: runs/archive_buggy_rlcd_direct_20260918/checkpoint
  parent: sft-qwen3-1.7b
  eval: runs/archive_buggy_rlcd_direct_20260918/eval_rlcd_direct.json
  mechanism: 'Same intent as rlcd-direct-qwen3-1.7b (direct calibration objective) but with a real bug:
    an unweighted per-action hard-label correctness term was always active regardless of config, fighting
    the Brier distributional term whenever the true posterior wasn''t one-hot (most records).'
  jev_comparison: 'Not a Jev-comparison checkpoint -- kept as a negative-result reference. Demonstrates
    concretely what happens when a hard-label confidence term and a distributional calibration term compete
    unweighted: ECE got WORSE on every single domain versus plain SFT, despite the reward nominally targeting
    calibration.'
  notes: Archived, not deleted, specifically so this failure mode has a preserved before/after rather
    than just a prose description. Do not use this checkpoint for anything except the negative-result
    comparison in docs/BENCHMARKS.md M8a.
rlcd-contrastive-qwen3-1.7b:
  date: '2026-09-19'
  checkpoint: checkpoints/rlcd-contrastive-qwen3-1.7b
  parent: sft-qwen3-1.7b
  eval: runs/eval_rlcd_contrastive.json
  mechanism: 'Phase 2, mechanism 1 (academic RLCD, Yang et al. 2023): 499 contrastive-principle pairs
    generated by nvidia/Qwen3.6-27B-NVFP4 (opposed calibrated-vs-overconfident principles) -> a Bradley-Terry
    reward model (itself a Noul menu scorer, 93.9% held-out pairwise accuracy) -> exact menu policy gradient
    with the RM''s per-action score folded in alongside Brier/abstention/conservative/injection shaping
    terms.'
  jev_comparison: This is 'RLCD' in the strict, citable, academic sense (Yang et al.) -- contrastive distillation
    for preference data, a real published technique that happens to share TypeSafe's acronym. Whether
    it resembles TypeSafe's undisclosed mechanism is unknown; it is included as one candidate, compared
    directly against the more literal mechanism-2 reading of TypeSafe's own reward description.
  notes: 'vs SFT and rlcd-direct on the same held-out test set: accuracy and ECE are essentially tied
    across all three (~0.81 acc, ~0.02 ECE -- neither RL mechanism clearly beats plain SFT+temperature-scaling
    on these). Injection flip rate shows a clear, monotonic trend: SFT 0.038 -> rlcd-direct 0.027 -> rlcd-contrastive
    0.016. The RM''s training claim (''not influenced by instructions inside the original state'') gives
    mechanism 1 a dedicated injection-resistance signal mechanism 2''s heuristic TV-distance term doesn''t
    fully replicate -- the clearest evidence so far that the contrastive/RM machinery earns its extra
    training cost, specifically for this one property, not for accuracy or ECE.'
grpo-qwen3-1.7b:
  date: '2026-09-19'
  checkpoint: checkpoints/grpo-qwen3-1.7b
  parent: sft-qwen3-1.7b
  eval: runs/eval_grpo.json
  mechanism: 'Ablation baseline: sampled single-token GRPO (TRL), reward = per-sample 0/1 correctness
    + a conservative-action penalty, on top of the SFT checkpoint. Capped to 1600 records / 300 steps
    (a much smaller training budget than the other three mechanisms'' full ~16,200-example runs) specifically
    because an uncapped run on the full corpus at 8 sampled completions/prompt projected roughly 9 hours
    -- this ablation exists to test whether sampling-based RL matters, not to be trained to full convergence
    at the same scale.'
  jev_comparison: 'Not a TypeSafe-comparison checkpoint. This is the ''standard RL'' control: the same
    general family of technique (policy-gradient RL from a scalar reward) that RLHF/RLVR use, contrasted
    with the exact menu policy gradient the other three mechanisms use. Its purpose is to test Claim A
    in docs/RESEARCH.md R1 (exact vs. sampled), not to approximate anything about Jev.'
  notes: 'Dramatically worse than all three exact-policy-gradient checkpoints on every axis: accuracy
    0.746 (vs ~0.81), ECE 0.158 (vs ~0.02, nearly 8x worse), injection_flip_rate 0.156 (vs 0.016-0.038,
    4-10x worse). This is close to the textbook argmax-collapse failure mode the exact menu policy gradient
    was designed to avoid: a 0/1-correctness reward on sampled actions pushes toward sharp, overconfident,
    less robust distributions because the policy never observes the full distribution it''s optimizing
    over. Caveat: trained on a much smaller budget (1600 records/300 steps vs ~16,200 examples for the
    others) for practicality, so the comparison is not perfectly matched on training scale -- but the
    direction and magnitude of the ECE/injection gap are consistent with the mechanism-level prediction,
    not just an undertrained model (accuracy alone dropping ~6pts wouldn''t explain an 8x ECE regression).'
