<line x1="895.0" y1="440" x2="895.0" y2="578" stroke="#e4e3df"/><text x="895.0" y="596" font-size="12" fill="#8a8985" text-anchor="middle">0.75</text>
<line x1="1080.0" y1="440" x2="1080.0" y2="578" stroke="#e4e3df"/><text x="1080.0" y="596" font-size="12" fill="#8a8985" text-anchor="middle">1.00</text>
<text x="326" y="461" font-size="14" fill="#0b0b0b" text-anchor="end">Clear (34 calls)</text><line x1="340" y1="456" x2="1080" y2="456" stroke="#e4e3df" stroke-dasharray="2 4"/>
<polygon points="1080.0,435.5 1087.0,442.5 1080.0,449.5 1073.0,442.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="1.5"><title>Jev (hosted) clear: 1.000</title></polygon>
<circle cx="992.9" cy="451.5" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"><title>spark-s1-4b-v3 clear: 0.882</title></circle>
