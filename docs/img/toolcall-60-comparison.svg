<text x="770" y="173" font-size="14" fill="#0b0b0b" text-anchor="end">0.917</text>
<text x="236" y="217" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="600">spark-s1-4b-v3</text>
<rect x="250" y="200" width="399.5" height="24" rx="3" fill="#eb6834"><title>spark-s1-4b-v3 accuracy 0.850</title></rect>
<text x="770" y="217" font-size="14" fill="#0b0b0b" text-anchor="end">0.850</text>
<text x="236" y="261" font-size="14" fill="#0b0b0b" text-anchor="end" font-weight="600">spark-s1-1.7b-v3</text>
