<text x="326" y="553" font-size="14" fill="#0b0b0b" text-anchor="end">Adversarial, benign-looking framing (12)</text><line x1="340" y1="548" x2="1080" y2="548" stroke="#e4e3df" stroke-dasharray="2 4"/>
<polygon points="1018.3,527.5 1025.3,534.5 1018.3,541.5 1011.3,534.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="1.5"><title>Jev (hosted) adversarial: 0.917</title></polygon>
<circle cx="1018.3" cy="543.5" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"><title>spark-s1-4b-v3 adversarial: 0.917</title></circle>
<circle cx="833.3" cy="552.5" r="5.5" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.2"><title>spark-s1-1.7b-v3 adversarial: 0.667</title></circle>
<circle cx="771.7" cy="561.5" r="6" fill="#a9a8a2" stroke="#fcfcfb" stroke-width="1.5"><title>Qwen3-4B, untrained adversarial: 0.583</title></circle>
<text x="48" y="628" font-size="12" fill="#52514e">An early version: spark-s1 was fine-tuned on 967 code-labelled rows and is being improved with more data. It is not at Jev parity (0.850 vs 0.917) and</text>
<text x="48" y="647" font-size="12" fill="#52514e">still misses security-weakening config changes and credential exfiltration. Rows in each slice line: Jev, 4B, 1.7B, untrained (top to bottom).</text>
<text x="48" y="666" font-size="12" fill="#52514e">The 60-case set is a diagnostic benchmark inspected during development, not a locked holdout; n=60 is about +/-5 points. Jev&#x27;s latency is a recorded hosted run that</text>
<text x="48" y="685" font-size="12" fill="#52514e">includes the network, so the latency gap is not a pure model-to-model comparison. Sources: themsquared/jev-benchmark (Apache-2.0), docs/BENCHMARKS.md B29, docs/img/toolcall-60-comparison.json.</text>
</svg>